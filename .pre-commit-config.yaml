# Pre-commit safeguards. Install once (wires both pre-commit and pre-push):
#   uv run pre-commit install
# Run against everything on demand:
#   uv run pre-commit run --all-files
#
# ruff / mypy / pytest run through `uv run --no-sync` so they use the exact
# versions pinned in uv.lock -- the same ones CI uses. A separately-pinned
# mirrors-mypy / ruff-pre-commit rev drifts from the project and starts
# disagreeing with CI.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # secrets/ holds real Google service-account keys.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key # belt-and-suspenders on key material
      - id: check-added-large-files # stop accidental data-dump commits
        args: ["--maxkb=512"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false # mypy uses the [tool.mypy] files setting

      - id: pytest
        name: pytest
        entry: uv run --no-sync python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push] # run the suite on push; keep commits fast
