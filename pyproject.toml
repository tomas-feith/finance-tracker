[project]
name = "finance-tracker"
version = "0.1.0"
description = "Live Google Sheets personal-finance dashboard (Streamlit + Plotly)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomás Feith" }]
dependencies = [
    "google-api-python-client",
    "google-auth",
    "pandas",
    "plotly",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
    "pre-commit",
    "pytest-cov>=7.1.0",
    "pandas-stubs",
]

# An installed package, so `from finance_tracker...` resolves the same way in the
# app, the tests and the CLI helpers. It replaced a `src/` directory of loose
# modules that each had to prepend sys.path to find its siblings and config.py.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The block-layout fixtures embed real non-breaking spaces, because that is what
# Google Sheets actually emits as a thousands separator in a European locale and
# it is exactly what parse_amount has to strip. Replacing them with plain spaces
# would quietly delete the case the test exists to cover.
"tests/test_parsers.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["finance_tracker", "tests"]
warn_unused_ignores = true
no_implicit_optional = true

# Named explicitly rather than a blanket ignore_missing_imports. The blanket
# form also silences an unresolvable FIRST-party import, which is not a
# hypothetical: app.py still did `from validate import sheet_totals` after the
# package restructure, and mypy had been quietly swallowing it because the flag
# made every unresolved import acceptable.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
# For a targeted run that would trip the floor: uv run pytest -k foo --no-cov

[tool.coverage.run]
source = ["finance_tracker"]
omit = ["tests/*"]

[tool.coverage.report]
# A ratchet, not an aspiration: currently ~74%. Only catches regressions; raise
# it as tests land. sheets_client.py (live Google API), validate.py and
# inspect_sheet.py are the untested remainder -- all three need a real sheet.
fail_under = 70
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
