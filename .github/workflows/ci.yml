name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Windows is the platform this is run on, and freeport.py exists because of
    # Windows bind semantics -- an Ubuntu-only build would never exercise it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag: setup-uv stopped publishing moving major tags after v7.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (type-check)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  secret-scan:
    # This repo's secrets/ holds real Google service-account keys. They are
    # gitignored, but gitleaks in pre-commit only runs if hooks are installed --
    # this job is the guard that cannot be skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: gitleaks scans commits, not the worktree
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organisation-owned repos.
