name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (from lockfile)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Mypy (type-check)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
